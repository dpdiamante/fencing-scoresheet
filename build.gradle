buildscript {
    dependencies {
        // Flyway's Gradle plugin needs the database support module and JDBC driver on its own classpath
        classpath 'org.flywaydb:flyway-database-postgresql:13.8.0'
        classpath 'org.postgresql:postgresql:42.7.13'
    }
}

plugins {
    id 'application'
    id 'java'
    id 'jacoco'
    id 'org.flywaydb.flyway' version '13.8.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.14.0'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.assertj:assertj-core:4.0.0-M1'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'dpd.lab.sports.fencing.cli.ScoresheetCli'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = "full"
    }

    afterTest { descriptor, result ->
        def durationMs = result.endTime - result.startTime
        println "${descriptor.className} > ${descriptor.name}: ${durationMs} ms"
    }

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        html.required = true
    }
}

// Database settings come from environment variables, falling back to env.properties (see env.properties.example)
def envProperties = new Properties()
def envFile = file('env.properties')
if (envFile.exists()) {
    envFile.withInputStream { envProperties.load(it) }
}

def dbSetting = { String key -> System.getenv(key) ?: envProperties.getProperty(key) }
def dbKeys = ['DB_HOST', 'DB_PORT', 'DB_NAME', 'DB_USER', 'DB_PASSWORD']

flyway {
    url = "jdbc:postgresql://${dbSetting('DB_HOST')}:${dbSetting('DB_PORT')}/${dbSetting('DB_NAME')}"
    user = dbSetting('DB_USER')
    password = dbSetting('DB_PASSWORD')
    locations = ['filesystem:src/main/resources/db/migration']
}

tasks.matching { it.name.startsWith('flyway') }.configureEach {
    doFirst {
        def missing = dbKeys.findAll { !dbSetting(it) }
        if (missing) {
            throw new GradleException("Missing database settings ${missing}: set them as environment variables or copy env.properties.example to env.properties")
        }
    }
}
